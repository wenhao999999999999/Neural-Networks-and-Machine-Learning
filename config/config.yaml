data:
  csv_path: data/sales_data_county_2018_2025.csv   # 你的宽表数据：date + 6列区县销量
  date_col: date

  # 需要同时作为“输入特征 & 预测目标”的区县列（6个）
  series_cols:
    - 0000000000000001A110000000000FYW
    - 0000000000000001A110000000000FYZ
    - 0000000000000001A110000000000FZ2
    - 0000000000000001A110000000000FZ5
    - 0000000000000001A110000000000FZ8
    - 0000000000001001A11000000000A5L0

  # 时间特征开关（可选）
  add_time_features: true
  weekday_cyclical: false
  month_cyclical: true
  freq: D

window:
  seq_len: 15
  pred_len: 1
  stride: 1

split:
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1

model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  # input_size 自动按 [len(series_cols) + 时间特征数] 计算，无需手填

train:
  device: cuda
  batch_size: 64
  epochs: 100
  lr: 0.001
  patience: 10
  seed: 42
  grad_clip: 1.0
  min_delta: 0.0

eval:
  metrics: [mae, mse, rmse, mape]

predict:
  horizon: 31

paths:
  outputs: outputs
  figures: outputs/figures

run_name: best_retrain1
